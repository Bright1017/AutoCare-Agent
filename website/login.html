<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6faf7">
<meta name="description" content="Log in to your AutoCare AI account.">
<title>Log in — AutoCare AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#11884d;--green-dark:#08703c;--ink:#142b30;--muted:#687a7b;--line:#e4ece6;--paper:#f6faf7;--mint:#e8f5ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 16%,#e0f3e7 0,transparent 40%),radial-gradient(ellipse at 90% 90%,#e8f5ed 0,transparent 35%),var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.top{height:76px;border-bottom:1px solid #e9efeb;background:#ffffffc9;display:flex;align-items:center}.top-inner{width:min(1120px,calc(100% - 44px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:inline-flex;align-items:center;gap:9px;font:800 20px Manrope,sans-serif;letter-spacing:-.8px;color:var(--ink);text-decoration:none}.brand-mark{width:36px;height:36px;border-radius:12px;color:#fff;background:var(--green);display:grid;place-items:center}.brand-mark svg{width:23px}.brand em{font-style:normal;color:var(--green)}.home-link{font-size:13px;font-weight:700;color:var(--green-dark);text-decoration:none}.layout{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:52px 20px}.card{width:min(460px,100%);background:#fff;border:1px solid #e8efe9;border-radius:22px;padding:38px;box-shadow:0 24px 70px #163d2514}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--green)}h1{font:800 32px/1.15 Manrope,sans-serif;letter-spacing:-1.3px;margin:10px 0}.intro{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 26px}.field{margin-bottom:17px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:7px}.input-wrap{position:relative}.field input{width:100%;border:1px solid #dfe9e2;border-radius:10px;padding:13px 14px;background:#fff;color:var(--ink);outline:0;font:13px 'DM Sans',sans-serif}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #11884d12}.password-input{padding-right:76px!important}.show-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--green-dark);font-size:11px;font-weight:700;padding:6px}.row{display:flex;justify-content:flex-end;margin-top:-8px;margin-bottom:20px}.text-button,.signup a{border:0;background:none;padding:0;color:var(--green-dark);font:700 11px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer}.submit{width:100%;border:0;border-radius:999px;background:var(--green);color:#fff;padding:14px 18px;font-size:13px;font-weight:700;box-shadow:0 8px 20px #11884d24;transition:.2s}.submit:hover{background:var(--green-dark);transform:translateY(-1px)}.submit:disabled{opacity:.65;cursor:wait;transform:none}.status{min-height:20px;margin:13px 0 0;color:var(--green-dark);font-size:12px;line-height:1.5}.status.error{color:#a12525}.signup{text-align:center;border-top:1px solid var(--line);margin:22px 0 0;padding-top:20px;font-size:12px;color:var(--muted)}@media(max-width:520px){.top{height:66px}.brand{font-size:18px}.layout{min-height:calc(100vh - 66px);padding:30px 16px}.card{padding:29px 23px;border-radius:18px}h1{font-size:29px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14.2v2.1c0 .6.4 1 1 1h1.1a2.4 2.4 0 0 0 4.7 0h6.4a2.4 2.4 0 0 0 4.7 0H22v-3.1a1 1 0 0 0-1-1h-1.3l-2-3.4a2.7 2.7 0 0 0-2.3-1.3H8.1a2.7 2.7 0 0 0-2.5 1.7l-1.4 3H4a1 1 0 0 0-1 1Z"/><path d="m6.2 13.2 1.2-2.6c.2-.5.7-.8 1.2-.8h2.8v3.4H6.2Zm6.5-3.4h2.4c.5 0 .9.2 1.2.7l1.7 2.7h-5.3V9.8Z"/><circle cx="7.4" cy="17.1" r=".55" fill="currentColor"/><circle cx="17.5" cy="17.1" r=".55" fill="currentColor"/></svg></span><span>Auto<em>Care AI</em></span></a><a class="home-link" href="index.html">Back to home</a></div></header>
<main class="layout"><section class="card" aria-labelledby="title"><div class="eyebrow">Welcome back</div><h1 id="title">Log in to AutoCare AI</h1><p class="intro">Sign in to continue finding or providing trusted automotive services.</p><form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div><div class="field"><label for="password">Password</label><div class="input-wrap"><input class="password-input" id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required><button class="show-password" type="button" id="togglePassword" aria-label="Show password">Show</button></div></div><div class="row"><button class="text-button" type="button" id="forgotPassword">Forgot password?</button></div><button class="submit" id="submitButton" type="submit">Log in <span aria-hidden="true">→</span></button><p class="status" id="status" role="status" aria-live="polite"></p></form><p class="signup">New to AutoCare AI? <a href="index.html?signup=1">Create an account</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://riikxvssyacpotgxmrhs.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_RdzzwB82RXjOKexUtJuvbg_4dnWjWFg';
const authClient=window.supabase?.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const form=document.getElementById('loginForm'),statusBox=document.getElementById('status'),submitButton=document.getElementById('submitButton');
function setStatus(message,isError=false){statusBox.textContent=message;statusBox.classList.toggle('error',isError)}
document.getElementById('togglePassword').addEventListener('click',event=>{const input=document.getElementById('password'),show=input.type==='password';input.type=show?'text':'password';event.currentTarget.textContent=show?'Hide':'Show';event.currentTarget.setAttribute('aria-label',show?'Hide password':'Show password')});
form.addEventListener('submit',async event=>{event.preventDefault();if(!authClient){setStatus('Sign-in is temporarily unavailable. Please refresh and try again.',true);return}submitButton.disabled=true;submitButton.textContent='Logging in…';setStatus('');try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await authClient.auth.signInWithPassword({email,password});if(error)throw error;window.location.href='index.html'}catch(error){setStatus(error.message||'Unable to log in. Please check your details and try again.',true)}finally{submitButton.disabled=false;submitButton.innerHTML='Log in <span aria-hidden="true">→</span>'}});
document.getElementById('forgotPassword').addEventListener('click',async()=>{if(!authClient){setStatus('Password reset is temporarily unavailable.',true);return}const email=document.getElementById('email').value.trim();if(!email){setStatus('Enter your email address first, then select “Forgot password?”.',true);document.getElementById('email').focus();return}try{const {error}=await authClient.auth.resetPasswordForEmail(email,{redirectTo:new URL('index.html',window.location.href).href});if(error)throw error;setStatus('If an account exists for this email, a password reset link will arrive shortly.')}catch(error){setStatus(error.message||'Unable to send a reset link. Please try again.',true)}});
if(!authClient)setStatus('Sign-in configuration could not be loaded. Please try again later.',true);
</script></body></html>
